name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" -DOPENSTEAMTOOL_VERSION="${{ github.event.inputs.version }}"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build Debug
        run: cmake --build build --config Debug

      # ost-manager.exe (CLI/GUI) plus ost-loader.exe (windowless IFEO helper)
      # ship inside the product folders so they always sit next to
      # OpenSteamTool.dll and the proxies.
      - name: Build ost tools
        run: |
          cmake --build build --config Release --target ost-manager ost-loader
          cmake --build build --config Debug --target ost-manager ost-loader

      - name: Stage ost tools into the product folders
        shell: pwsh
        run: |
          Copy-Item build\tools\Release\ost-manager.exe build\Release
          Copy-Item build\tools\Release\ost-loader.exe build\Release
          Copy-Item build\tools\Debug\ost-manager.exe build\Debug
          Copy-Item build\tools\Debug\ost-loader.exe build\Debug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Release
          path: build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Debug
          path: build/Debug/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Package Release
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Release.zip ".\build\Release\*" '-x!*.lib' '-x!*.exp' '-x!*.pdb' '-x!*.ilk' -mx5

      - name: Package Debug
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip ".\build\Debug\*" '-x!*.lib' '-x!*.exp' '-x!*.pdb' '-x!*.ilk' -mx5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ## 安装方法

            下载 `OpenSteamTool-${{ github.event.inputs.version }}-Release.zip`（如需 `<steam>/opensteamtool` 目录下的运行日志，请下载 `-Debug` 版本）。

            解压并将 `dwmapi.dll`、`xinput1_4.dll` 和 `OpenSteamTool.dll` 复制到 Steam 根目录（例如 `C:\Program Files (x86)\Steam`）。

            `dwmapi.dll` 是默认注入入口：由 `bin\vgui2_s.dll` 加载，不会被部分游戏的反作弊系统拦截，可正常游玩（如 EAC/BE 等）；缺点是部分校验 steamclient 的游戏会崩溃（如卡普空的鬼武者/龙信2 等）。

            `version.dll.disabled` 是早注隔离专用入口，默认禁用（保留 `.disabled` 后缀即不加载），需要启用时去掉后缀改名回 `version.dll` 再重启 Steam：作为 steam.exe 静态导入在启动早期加载，具备隔离 steamclient 进行副本 hook 的能力，能解决部分游戏崩溃问题（如卡普空的鬼武者/龙信2 等）；缺点是会被部分游戏的反作弊系统拦截，无法游玩（如 EAC/BE 等）。

            两个入口二选一，不要同时启用。

            创建 Lua 配置目录（例如 `C:\Program Files (x86)\Steam\config\lua`）并将 Lua 脚本放在那里。**不要**放在 `C:\Program Files (x86)\Steam\config\stplug-in`！
          files: |
            OpenSteamTool-${{ github.event.inputs.version }}-Release.zip
            OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip
